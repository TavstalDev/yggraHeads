main: com.github.TavstalDev.yggraHeads.YggraHeads
version: 1.2.0
api-version: '1.13'

name: YggraHeads
prefix: YggraHeads
authors: [ Tavstal ]
description: A free and open-source heads menu plugin with GUI support.
website: https://github.com/TavstalDev/yggraHeads
softdepend: [Vault]
commands:
  heads:
    description: Opens the heads menu GUI.
    usage: /heads
    permission: yggraHeads.commands.heads
    subcommands:
      help:
        description: "Show help for the heads command"
        usage: "/heads help"
        permission: yggraHeads.commands.help
      version:
        description: "Show the version of the plugin"
        usage: "/heads version"
        permission: yggraHeads.commands.version
      reload:
        description: "Reload the plugin"
        usage: "/heads reload"
        permission: yggraHeads.commands.reload
permissions:
  yggraHeads.commands.heads:
    description: Allows the player to use the /heads command.
    default: op
  yggraHeads.commands.reload:
    default: op
  yggraHeads.commands.version:
    default: op
  yggraHeads.commands.help:
    default: op
  yggraHeads.player:
    description: Collection of player permissions
    default: op
    children:
      yggraHeads.commands.heads: true
      yggraHeads.commands.help: true
      yggraHeads.commands.version: true
  yggraHeads.admin:
    description: Collection of admin permissions
    default: op
    children:
      yggraHeads.commands.reload: true
  yggraHeads.*:
    description: Gives all permissions related to the yggraHeads plugin.
    default: op
    children:
      yggraHeads.player: true
      yggraHeads.admin: true